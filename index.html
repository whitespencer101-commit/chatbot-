<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagos Fresh Fashion</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#fff8f0;color:#1f2430}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08)}
nav b{font-size:20px;color:#b45309}
.hero{padding:60px 20px;text-align:center;color:#fff;background:linear-gradient(135deg,#b45309,#f59e0b 55%,#16a34a)}
.hero h1{margin:0 0 8px;font-size:34px}
.hero p{margin:0 0 18px;font-size:17px}
.hero a{background:#fff;color:#b45309;padding:11px 24px;border-radius:24px;font-weight:700;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding:24px 20px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card .pic{height:150px;display:grid;place-items:center;font-size:64px}
.card div.t{padding:12px 14px}
.card b{display:block}.card span{color:#16a34a;font-weight:700}
h2{text-align:center;margin:28px 0 0}

#cb-btn{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;border:0;background:#16a34a;color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:9999}
#cb{position:fixed;right:18px;bottom:90px;width:350px;max-width:calc(100vw - 24px);height:520px;max-height:calc(100vh - 110px);background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:none;flex-direction:column;overflow:hidden;z-index:9999}
#cb.open{display:flex}
#cb-h{padding:12px 14px;border-bottom:1px solid #eef0f3;display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;font-weight:700}
#cb-h div.i{flex:1}
#cb-h b{display:block}#cb-h small{color:#16a34a}
#human{font-size:12px;border:1px solid #16a34a;color:#16a34a;background:#fff;border-radius:16px;padding:5px 10px;text-decoration:none;white-space:nowrap}
#cb-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.bot{background:#eef0f3;align-self:flex-start;border-bottom-left-radius:4px}
.me{background:#16a34a;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.md{align-self:flex-start;max-width:82%;border-radius:14px;overflow:hidden;background:#eef0f3}
.md img,.md video{width:100%;display:block}
.md .ph{height:130px;display:grid;place-items:center;font-size:54px}
.md p{margin:0;padding:8px 12px;font-size:14px}
.order{align-self:flex-start;max-width:90%;background:#ecfdf3;border:1px solid #16a34a;border-radius:14px;padding:12px;font-size:14px}
.order pre{margin:0 0 10px;white-space:pre-wrap;font:inherit}
.order a{display:block;text-align:center;background:#16a34a;color:#fff;text-decoration:none;padding:10px;border-radius:20px;font-weight:700}
.ty{font-size:13px;color:#667085}
#cb-f{display:flex;gap:8px;padding:10px;border-top:1px solid #eef0f3}
#cb-t{flex:1;padding:11px 14px;border:1px solid #e1e4e8;border-radius:22px;font-size:15px;min-width:0}
#cb-s{border:0;background:#16a34a;color:#fff;border-radius:22px;padding:0 18px;cursor:pointer}
#cb-s:disabled{opacity:.5}
</style>
</head>
<body>

<nav><b>👗 Lagos Fresh Fashion</b><span>Shop · Delivery · Contact</span></nav>
<div class="hero">
  <h1>New Arrivals Are Here</h1>
  <p>Ankara, Agbada, shoes and more. Delivery across Nigeria.</p>
  <a href="#shop">Shop now</a>
</div>
<h2 id="shop">Popular Items</h2>
<div class="grid">
  <div class="card"><div class="pic" style="background:#fde68a">👕</div><div class="t"><b>Ankara Shirt</b><span>₦18,000</span></div></div>
  <div class="card"><div class="pic" style="background:#fed7aa">👞</div><div class="t"><b>Leather Slides</b><span>₦12,500</span></div></div>
  <div class="card"><div class="pic" style="background:#bfdbfe">🧥</div><div class="t"><b>Agbada Set</b><span>₦65,000</span></div></div>
</div>

<button id="cb-btn" aria-label="Chat">💬</button>
<div id="cb">
  <div id="cb-h"><div class="av">A</div><div class="i"><b>Amaka · Sales</b><small>● Online</small></div><a id="human" target="_blank" rel="noopener">Talk to a human</a></div>
  <div id="cb-log"></div>
  <form id="cb-f"><input id="cb-t" placeholder="Type a message…" autocomplete="off"><button id="cb-s">Send</button></form>
</div>

<script>
// ===== EDIT THESE =====
const API_URL = "/api/chat.js";
const AGENT = "Amaka";
const WHATSAPP = "2348000000000"; // same number as in api/chat.js
const WELCOME = "Hi, welcome to Lagos Fresh Fashion! I’m Amaka. What are you looking for today?";
// ids must match api/chat.js. Add real "img" and "video" links when you have them.
const MEDIA = {
  p1:{name:"Ankara Shirt · ₦18,000", emoji:"👕", color:"#fde68a", img:""},
  p2:{name:"Leather Slides · ₦12,500", emoji:"👞", color:"#fed7aa", img:""},
  v1:{name:"Agbada Set · ₦65,000", emoji:"🧥", color:"#bfdbfe", img:"", video:""}
};
// ======================

const $=id=>document.getElementById(id);
const log=$("cb-log"),form=$("cb-f"),inp=$("cb-t"),send=$("cb-s");
const history=[];
$("human").href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Hello, I need help from a person.");

$("cb-btn").onclick=()=>{
  $("cb").classList.toggle("open");
  if(!log.children.length) msg("bot",WELCOME);
};
function down(){log.scrollTop=log.scrollHeight}
function msg(cls,text){const d=document.createElement("div");d.className="m "+cls;d.textContent=text;log.appendChild(d);down()}
function media(id,isVideo){
  const p=MEDIA[id]; if(!p) return;
  const d=document.createElement("div"); d.className="md";
  if(isVideo && p.video){
    const v=document.createElement("video"); v.src=p.video; v.controls=true; v.playsInline=true; if(p.img) v.poster=p.img; d.appendChild(v);
  } else if(p.img){
    const i=document.createElement("img"); i.src=p.img; i.alt=p.name; d.appendChild(i);
  } else {
    const h=document.createElement("div"); h.className="ph"; h.style.background=p.color; h.textContent=p.emoji; d.appendChild(h);
  }
  const c=document.createElement("p"); c.textContent=p.name; d.appendChild(c);
  log.appendChild(d); down();
}
function card(text,link,label){
  const d=document.createElement("div"); d.className="order";
  if(text){const pre=document.createElement("pre"); pre.textContent=text; d.appendChild(pre);}
  const a=document.createElement("a"); a.href=link; a.target="_blank"; a.rel="noopener"; a.textContent=label; d.appendChild(a);
  log.appendChild(d); down();
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const q=inp.value.trim(); if(!q) return;
  inp.value=""; msg("me",q); history.push({role:"user",content:q});
  send.disabled=true;
  const ty=document.createElement("div"); ty.className="ty"; ty.textContent=AGENT+" is typing…"; log.appendChild(ty); down();
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history.slice(-20)})});
    const data=await r.json();
    ty.remove();
    if(!data.reply && !data.order) throw new Error(data.error||"no reply");
    if(data.reply){ msg("bot",data.reply); history.push({role:"assistant",content:data.reply}); }
    (data.media||[]).forEach(m=>media(m.id,m.type==="vid"));
    if(data.order){
      card(data.order.summary,data.order.link,"Send this order on WhatsApp");
      history.push({role:"assistant",content:"[Order request prepared for the customer to send on WhatsApp. Not yet confirmed by the owner.]"});
    }
    if(data.handoff) card("",data.handoff.link,"Chat with a person on WhatsApp");
  }catch(err){
    ty.remove(); msg("bot","Sorry, network issue. ("+err.message+")");
    history.pop(); // drop the failed question so the chat stays in order
  }
  send.disabled=false; inp.focus();
});
</script>
</body>
</html>
